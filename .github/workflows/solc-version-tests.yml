name: Solc Version Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: recursive
      - run: yarn install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly

      - name: Run Forge tests against lowest and highest supported solc version
        run: >
          forge test --use 0.8.16 --nmt "FuzzDifferentialOracleSuite" &&
          forge test --use 0.8.27 --nmt "FuzzDifferentialOracleSuite"
